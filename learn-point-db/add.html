<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Add Point to Database</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""></script>
    <style>
        #map {
            width: 426px;
            height: 240px;
        }
    </style>
</head>
<body>
<main>
    <a href="read-all.php">Back</a>
    <div id="map"></div>
    <form action="process-add.php" method="post">
        <label for="name">Name</label>
        <input type="text" id="name" name="name">
        <br>
        <label for="lat">Latitude</label>
        <input type="text" id="lat" name="lat" readonly>
        <br>
        <label for="lng">Longitude</label>
        <input type="text" id="lng" name="lng" readonly>
        <br>
        <button type="reset">Reset</button>
        <button type="submit">Submit</button>
    </form>
</main>
<script>
    let center = [-0.0594, 109.3519];
    var map = L.map('map').setView(center, 13);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map);
    // Prepare a marker
    let marker;
    // Catch click event on map
    map.on('click', function(e){
        // Get coordinates
        const lat = e.latlng.lat;
        const lng = e.latlng.lng;
        // Add as input form values
        document.getElementById('lat').value = lat;
        document.getElementById('lng').value = lng;
        if (marker) { // When a marker exists on map
            map.removeLayer(marker); // Remove old marker
        }
        marker = L.marker({lat,lng}).addTo(map); // Add a new one
    });
</script>
</body>
</html>
